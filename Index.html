<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Se, Lyssna, agera. 2026 – S:t Eliyo Scoutkår</title>

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:Arial,Helvetica,sans-serif;
      color:#fff;
      background:
        radial-gradient(circle at 15% 10%,rgba(140,82,255,.34),transparent 32%),
        radial-gradient(circle at 90% 15%,rgba(255,79,179,.28),transparent 36%),
        linear-gradient(135deg,#090611,#140d21,#1d102d);
    }
    .card{
      width:100%;
      max-width:540px;
      padding:36px;
      border-radius:28px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.075);
      box-shadow:0 0 40px rgba(140,82,255,.17),0 0 70px rgba(255,79,179,.12);
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
    }
    .label{
      margin-bottom:12px;
      color:#c7a5ff;
      font-size:12px;
      font-weight:900;
      letter-spacing:.13em;
      text-transform:uppercase;
    }
    h1{
      margin:0 0 16px;
      font-size:38px;
      line-height:1;
      letter-spacing:-.04em;
      background:linear-gradient(90deg,#fff,#d9c5ff,#ffafe0);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }
    p{
      margin:0;
      color:rgba(255,255,255,.72);
      font-size:15px;
      line-height:1.65;
    }
    .status{
      display:flex;
      align-items:center;
      gap:9px;
      margin-top:24px;
      padding:14px 16px;
      border-radius:15px;
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.12);
      color:rgba(255,255,255,.9);
      font-size:14px;
      font-weight:700;
    }
    .dot{
      width:10px;
      height:10px;
      flex:0 0 auto;
      border-radius:50%;
      background:#ff4fb3;
      box-shadow:0 0 16px rgba(255,79,179,.9);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="label">S:t Eliyo Scoutkår</div>
    <h1>Se, Lyssna, agera.</h1>
    <p>Detta är backend-tjänsten för aktivitetens anmälningssida. Den publika anmälan ligger på S:t Eliyo Scoutkårs GitHub Pages-webbplats.</p>
    <div class="status"><span class="dot"></span>Apps Script-backend är aktiv</div>
  </main>
</body>
</html>
